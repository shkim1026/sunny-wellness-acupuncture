<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sunSealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d45633" />
      <stop offset="55%" stop-color="#c44d2b" />
      <stop offset="100%" stop-color="#9b3416" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5be6b" />
      <stop offset="100%" stop-color="#e08942" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Sun / Traditional Seal Medallion -->
  <circle cx="256" cy="256" r="240" fill="url(#sunSealBg)" />

  <!-- Subtle Inner Gold Sun Ring -->
  <circle
    cx="256"
    cy="256"
    r="208"
    fill="none"
    stroke="url(#goldRing)"
    stroke-width="10"
    opacity="0.88"
  />

  <!-- Chinese Character 日 (Sun) - Authentic Calligraphic / Song-Kai Hybrid Vector -->
  <g fill="#faf8f5">
    <!-- Left Vertical Stroke (竖) with top brush entry & bottom dewdrop foot extending below bottom bar -->
    <path d="
      M 164 114
      C 164 106, 173 102, 184 108
      L 206 120
      L 204 388
      C 204 402, 194 412, 183 412
      C 171 412, 164 401, 164 386
      Z
    " />

    <!-- Top Horizontal & Right Vertical Stroke (横折) with calligraphic corner shoulder & bottom foot -->
    <path d="
      M 184 114
      L 316 104
      C 326 103, 336 96, 344 102
      C 356 110, 362 121, 354 132
      C 349 139, 348 148, 348 162
      L 348 386
      C 348 404, 337 416, 323 416
      C 310 416, 304 405, 304 388
      L 304 140
      L 184 146
      Z
    " />

    <!-- Middle Horizontal Stroke (中横) with gentle upward tilt and classic breathing gap on right -->
    <path d="
      M 196 242
      L 276 233
      C 289 231, 302 238, 302 249
      C 302 259, 291 266, 276 266
      L 196 270
      Z
    " />

    <!-- Bottom Closing Horizontal Stroke (底横) connecting left & right verticals above their feet -->
    <path d="
      M 194 352
      L 318 348
      L 318 382
      L 194 384
      Z
    " />
  </g>
</svg>
